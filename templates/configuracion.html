<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Configuración - Promotores del Agro</title>
    <!-- Enlace al archivo de estilos global -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body { padding: 16px; }
        .main-content { width: 100%; max-width: 1400px; margin: 0 auto; }
        
        /* Ajuste de la barra superior para acomodar el logo grande y el eslogan debajo */
        .top-navbar { padding: 14px 20px; }
        .logo-container-top { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
        .logo-container-top img { height: 75px; width: auto; object-fit: contain; }
        .logo-slogan-italic { font-size: 10px; font-style: italic; color: var(--text-secondary); margin-left: 2px; letter-spacing: 0.3px; }

        /* Cajas Principales */
        .card-box { background: var(--bg-card); border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.2); margin-bottom: 25px; overflow: hidden; border: 1px solid var(--border-color); }
        .card-header { background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); color: var(--green-primary); padding: 16px 20px; font-weight: bold; font-size: 15px; letter-spacing: 0.5px; text-transform: uppercase; }
        .card-body { padding: 25px; }

        /* Formularios y Grids */
        .form-row { display: grid; gap: 20px; margin-bottom: 20px; }
        .row-2 { grid-template-columns: 1fr 1fr; }

        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 12px; font-weight: bold; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; }
        .form-group input { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-white); padding: 11px 14px; border-radius: 8px; font-size: 14px; outline: none; text-transform: uppercase; }
        .form-group input:focus { border-color: var(--green-primary); }

        /* Botones */
        .btn-save { background-color: var(--green-primary); color: var(--bg-main); border: none; padding: 12px 25px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 14px; text-transform: uppercase; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-save:hover { background-color: #35f5aa; }

        /* Modal Alerta Simple */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-card { background: var(--bg-card); padding: 30px; border-radius: 12px; max-width: 450px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--border-color); border-top: 5px solid var(--green-primary); text-align: center; position: absolute; }
        .modal-card h3 { color: var(--green-primary); font-size: 18px; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; text-transform: uppercase; font-weight: bold; }
        .modal-card p { font-size: 13px; color: var(--text-white); margin-bottom: 20px; line-height: 1.4; text-transform: uppercase; }
        .btn-modal-close { background: var(--green-primary); color: var(--bg-main); border: none; padding: 10px 22px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; text-transform: uppercase; }
        .btn-modal-close:hover { background: #35f5aa; }
    </style>
</head>
<body>

    <!-- Barra Superior con Logo Grande, Eslogan y Menú Unificado -->
    <div class="top-navbar">
        <div class="nav-left">
            <div class="logo-container-top">
                <img src="/static/logo.png" alt="Promotores del Agro" onerror="this.style.display='none'">
                <span class="logo-slogan-italic">Asegura tus buenas cosechas</span>
            </div>
            <div class="nav-menu" style="margin-left: 20px; align-self: center;">
                <a href="/dashboard" class="nav-link">PANEL</a>
                <a href="/stock" class="nav-link">STOCK</a>
                <a href="/ventas" class="nav-link">VENTAS</a>
                <a href="/gastos" class="nav-link">GASTOS</a>
                <a href="/amortizaciones" class="nav-link">AMORTIZACIONES</a>
                <a href="/compras" class="nav-link">COMPRAS</a>
                <a href="/configuracion" class="nav-link active">CONFIGURACIÓN</a>
            </div>
        </div>
        <div class="nav-right" style="align-self: center;">
            <div class="icon-btn" title="Configuración" onclick="window.location.href='/configuracion'">⚙️</div>
            <div class="icon-btn" title="Notificaciones">
                🔔
                <span class="notification-dot"></span>
            </div>
            <button class="user-avatar" title="Katia Baldera López (Gerente)">K</button>
        </div>
    </div>

    <!-- Contenido Principal -->
    <div class="main-content">
        <div class="card-box">
            <div class="card-header">CONFIGURACIÓN DEL SISTEMA - DATOS DE LA EMPRESA</div>
            <div class="card-body">
                <form action="/guardar_configuracion" method="POST" id="form-configuracion">
                    <div class="form-row row-2">
                        <div class="form-group">
                            <label>Razón Social:</label>
                            <input type="text" id="cfg-razon" value="PROMOTORES DEL AGRO JK E.I.R.L." required>
                        </div>
                        <div class="form-group">
                            <label>RUC:</label>
                            <input type="text" id="cfg-ruc" value="20611525304" required>
                        </div>
                    </div>
                    <div style="margin-top: 10px;">
                        <button type="submit" class="btn-save">💾 GUARDAR DATOS EMPRESA</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Alerta -->
    <div id="modal-alerta" class="modal-overlay">
        <div class="modal-card">
            <h3>PROMOTORES DEL AGRO</h3>
            <p id="modal-mensaje">DATOS DE LA EMPRESA ACTUALIZADOS CON ÉXITO.</p>
            <div>
                <button type="button" class="btn-modal-close" id="btn-cerrar-alerta">ACEPTAR</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('form-configuracion').addEventListener('submit', function(e) {
            e.preventDefault();
            // Guardar opcionalmente en localStorage si lo manejas del lado cliente
            localStorage.setItem('agro_razon_social', document.getElementById('cfg-razon').value);
            localStorage.setItem('agro_ruc', document.getElementById('cfg-ruc').value);

            document.getElementById('modal-alerta').style.display = 'flex';
        });

        document.getElementById('btn-cerrar-alerta').addEventListener('click', function() {
            document.getElementById('modal-alerta').style.display = 'none';
        });
    </script>

</body>
</html>
